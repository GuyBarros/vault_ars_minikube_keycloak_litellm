# Local-only direct access to the CIBA approval page at localhost:8082 (no
# kubectl port-forward needed - see bootstrap.sh's --ports publishing,
# 8082->30082).
#
# Patches the Service that deploy-k8s/ciba-channel-gateway.yaml's Consul API
# Gateway auto-creates (named after the Gateway, "ciba-channel-gateway") to a
# fixed NodePort, mirroring keycloak-nodeport.yaml. Apply
# ciba-channel-gateway.yaml first (creates this Service).
apiVersion: v1
kind: Service
metadata:
  name: ciba-channel-gateway
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
