# Local-only direct access to LiteLLM's admin UI at localhost:4000 (no kubectl
# port-forward needed - see bootstrap.sh's --ports publishing, 4000->30083).
#
# Patches the Service that deploy-k8s/litellm-gateway-gateway.yaml's Consul API
# Gateway auto-creates (named after the Gateway, "litellm-api-gateway") to a
# fixed NodePort, mirroring keycloak-nodeport.yaml. Apply
# litellm-gateway-gateway.yaml first (creates this Service).
apiVersion: v1
kind: Service
metadata:
  name: litellm-api-gateway
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30083
