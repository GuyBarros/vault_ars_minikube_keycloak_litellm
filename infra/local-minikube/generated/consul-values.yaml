global:
  enabled: true
  name: consul
  datacenter: dc1
  logLevel: info
  metrics:
    enabled: true
    enableGatewayMetrics: true
  image: "hashicorp/consul-enterprise:2.0.1-ent"
  tls:
    enabled: true
    enableAutoEncrypt: true
  acls:
    manageSystemACLs: true
    bootstrapToken:
      secretName: consul-bootstrap-token
      secretKey: token
  # Enterprise namespaces + k8s-namespace mirroring, so workloads register into a
  # Consul namespace matching their k8s namespace (e.g. default, opa). The
  # consul-mcp-authz ACL policy reads catalog across all namespaces to match.
  enableConsulNamespaces: true
  enterpriseLicense:
    secretName: consul-ent-license
    secretKey: key
server:
  enabled: true
  replicas: 1
  bootstrapExpect: 1
  storage: 5Gi
  # Vault's CA, mounted at /consul/userconfig/vault-ca/ca.crt so the Vault
  # Connect CA provider (configured post-Vault-init by configure.sh) can verify
  # Vault's TLS certificate.
  extraVolumes:
    - type: secret
      name: vault-ca
      load: false
ui:
  enabled: true
  service:
    enabled: true
    type: NodePort
    nodePort:
      https: 31501
# Sidecar (Envoy) injection for the deploy-k8s workloads, which carry
# `consul.hashicorp.com/connect-inject: "true"` and rely on ServiceIntentions /
# ServiceDefaults / API Gateway CRDs. The in-cluster server runs the injector
# webhook directly — no separate Consul client release is needed.
connectInject:
  enabled: true
  metrics:
    defaultEnabled: true
    defaultEnableMerging: true
    defaultMergedMetricsPort: 20100
  consulNamespaces:
    mirroringK8S: true
  sidecarProxy:
    lifecycle:
      defaultEnabled: true
      defaultStartupGracePeriodSeconds: 30
  apiGateway:
    manageExternalCRDs: true
    managedGatewayClass:
      deployment:
        defaultInstances: 1
        minInstances: 1
        maxInstances: 2
dns:
  enabled: true
