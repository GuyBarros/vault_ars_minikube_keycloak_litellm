[project]
name = "consul-mcp-authz"
version = "0.1.0"
description = "REST API for managing the MCP authorization catalog stored in Vault KV v2."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "hvac>=2.4.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "requests>=2.32.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "app_logging",
    "catalog",
    "config",
    "discovery",
    "exceptions",
    "models",
]
