; consul-mcp-authz — runs the FastAPI backend and the Next.js operator
; console inside the same container. supervisord forwards SIGTERM from
; PID 1 to both children so K8s drains cleanly.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:api]
; Absolute path so the program runs regardless of supervisord's sanitized
; PATH. The venv at /app/.venv/bin is on PATH for interactive shells but
; supervisor strips it when spawning children.
command=/app/.venv/bin/uvicorn api.main:app --host 0.0.0.0 --port 8080
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ui]
command=/usr/local/bin/node /app/ui/server.js
directory=/app/ui
environment=PORT="8502",HOSTNAME="0.0.0.0"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
