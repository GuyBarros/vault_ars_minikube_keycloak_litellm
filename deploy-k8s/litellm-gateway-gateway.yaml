# Dedicated Consul API Gateway front door for LiteLLM's admin UI, mirroring
# keycloak-gateway.yaml. Browsers are not mesh workloads, so they cannot pass
# service-intentions on litellm-gateway's inbound sidecar directly; the
# gateway is the one mesh-authorized caller (see service-intentions.yaml).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: litellm-api-gateway
spec:
  gatewayClassName: consul
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: litellm-route
spec:
  parentRefs:
    - name: litellm-api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm-gateway
          port: 4000
