apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/enable-metrics-merging: 'false'

        # ---- consul-mcp-authz discovery ----
        # Marks this workload as an MCP-authz "agent" — the source side of
        # rule entries. consul-mcp-authz scans Consul ServiceMeta for
        # this annotation to populate GET /v1/agents.
        consul.hashicorp.com/service-meta-agent-tool-authz-role: "agent"

        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject: "true"
        # Kubernetes auth: Vault attests the pod via TokenReview (service
        # account default/ai-agent) before it will mint the SPIFFE ID.
        vault.hashicorp.com/role: "ai-agent"
        vault.hashicorp.com/auth-type: "kubernetes"
        vault.hashicorp.com/auth-path: "auth/kubernetes"

        # The actor token is a JWT-SVID (sub = the agent's SPIFFE ID) minted
        # by Vault's SPIFFE secrets engine; aud is what token-exchange requires.
        vault.hashicorp.com/agent-inject-secret-actor-token: "spiffe/role/ai-agent/mintjwt"
        vault.hashicorp.com/agent-inject-template-actor-token: |
          {{- with secret "spiffe/role/ai-agent/mintjwt" "audience=agent-actor" -}}
          {{ .Data.token }}
          {{- end -}}
        vault.hashicorp.com/tls-skip-verify: "true"
    spec:
      serviceAccountName: ai-agent
      containers:
        - name: ai-agent
          image: panchalravi/agentguard-ai-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: TOKEN_EXCHANGE_URL
              value: http://token-exchange.virtual.consul/v1/identity/obo-token
            - name: ACTOR_TOKEN_PATH
              value: /vault/secrets/actor-token
            - name: USER_MCP_URL
              value: http://litellm-gateway.virtual.consul:4000/user_mcp/mcp
          volumeMounts:
            - name: app-env
              mountPath: /app/.env
              subPath: .env
              readOnly: true
      volumes:
        - name: app-env
          secret:
            secretName: ai-agent-env
            items:
              - key: .env
                path: .env
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
spec:
  selector:
    app: ai-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent