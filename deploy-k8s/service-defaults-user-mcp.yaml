apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: user-mcp
  namespace: default
spec:
  # Writes gated by CIBA now block on LiteLLM (pre_mcp_call) for up to
  # PEP_CIBA_POLL_TIMEOUT_SECONDS (~110s) before this hop even starts.
  # Keep a generous inbound timeout so a slow SQL/Vault retrieve cannot
  # 504 after the gateway already approved the call.
  localRequestTimeoutMs: 150000
  protocol: http
