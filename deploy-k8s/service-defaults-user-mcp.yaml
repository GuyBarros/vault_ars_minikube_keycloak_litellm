apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: user-mcp
  namespace: default
spec:
  # Keep a generous inbound timeout so a slow SQL/Vault retrieve (and local
  # LLM latency upstream) cannot 504 after the gateway already approved the
  # call.
  localRequestTimeoutMs: 150000
  protocol: http
