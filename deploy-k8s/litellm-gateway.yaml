# LiteLLM proxy: PEP + AI Gateway. Callers are identified by their mesh
# (SPIFFE) identity; Authorization is the upstream JWT. tools/call asks
# opa-server (catalog + scope) and injects the OBO JWT toward user-mcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-gateway
  template:
    metadata:
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/enable-metrics-merging: 'false'
        # So consul-mcp-authz lists this gateway as a catalog source now that
        # it is the mTLS peer user-mcp sees on every tools/call.
        consul.hashicorp.com/service-meta-agent-tool-authz-role: "agent"

        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "litellm-gateway"
        vault.hashicorp.com/auth-type: "jwt"
        vault.hashicorp.com/auth-path: "auth/k8s_jwt"
        vault.hashicorp.com/auth-config-path: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        vault.hashicorp.com/auth-config-remove-jwt-after-reading: "false"
        vault.hashicorp.com/tls-skip-verify: "true"
        vault.hashicorp.com/template-static-secret-render-interval: "30s"
        vault.hashicorp.com/agent-inject-secret-actor-token: "identity/oidc/token/agent-role"
        vault.hashicorp.com/agent-inject-template-actor-token: |
          {{- with secret "identity/oidc/token/agent-role" -}}
          {{ .Data.token }}
          {{- end -}}
      labels:
        app: litellm-gateway
    spec:
      serviceAccountName: litellm-gateway
      enableServiceLinks: false
      containers:
        - name: litellm-gateway
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
          env:
            - name: PYTHONPATH
              value: /app
            # Local LLM tool calls can run long; LiteLLM's MCP client default is 60s.
            - name: LITELLM_MCP_CLIENT_TIMEOUT
              value: "150"
            - name: LITELLM_MCP_TOOL_LISTING_TIMEOUT
              value: "30"
            # Admin UI SSO against the demo Keycloak realm. Browser hits
            # localhost:8081; the pod exchanges the code on the mesh.
            - name: PROXY_BASE_URL
              value: "http://localhost:4000"
            - name: PROXY_LOGOUT_URL
              value: "http://localhost:8081/realms/demo/protocol/openid-connect/logout?client_id=litellm&post_logout_redirect_uri=http://localhost:4000/ui"
            - name: GENERIC_CLIENT_ID
              value: "litellm"
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: "http://localhost:8081/realms/demo/protocol/openid-connect/auth"
            - name: GENERIC_TOKEN_ENDPOINT
              value: "http://keycloak.virtual.consul:8080/realms/demo/protocol/openid-connect/token"
            - name: GENERIC_USERINFO_ENDPOINT
              value: "http://keycloak.virtual.consul:8080/realms/demo/protocol/openid-connect/userinfo"
            - name: GENERIC_SCOPE
              value: "openid profile email roles"
            - name: GENERIC_CLIENT_USE_PKCE
              value: "true"
            # preferred_username is "admin" / "writer" / "user", matching
            # PROXY_ADMIN_ID and the Keycloak demo accounts. `sub` is a UUID
            # so PROXY_ADMIN_ID=admin never fired after SSO.
            - name: GENERIC_USER_ID_ATTRIBUTE
              value: "preferred_username"
            - name: GENERIC_USER_EMAIL_ATTRIBUTE
              value: "email"
            - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
              value: "preferred_username"
            - name: GENERIC_INCLUDE_TOKEN_CLAIMS
              value: "true"
            - name: GENERIC_ROLE_MAPPINGS_GROUP_CLAIM
              value: "groups"
            - name: GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE
              value: "internal_user_viewer"
            - name: GENERIC_ROLE_MAPPINGS_ROLES
              value: "{'proxy_admin': ['admin'], 'internal_user': ['writer'], 'internal_user_viewer': ['reader']}"
            - name: PROXY_ADMIN_ID
              value: "admin"
            # Password form on /ui/login (SSO is the Keycloak button).
            - name: UI_USERNAME
              value: "admin"
            - name: UI_PASSWORD
              value: "admin"
            - name: PEP_ACTOR_TOKEN_PATH
              value: /vault/secrets/actor-token
          envFrom:
            - secretRef:
                name: litellm-gateway-env
          readinessProbe:
            httpGet:
              # LiteLLM's built-in public routes are /health/liveliness (not
              # /health, which requires a key). custom_auth also allows /health,
              # but liveliness stays green even if that hook is off.
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: litellm-config
              mountPath: /app/pdp_auth.py
              subPath: pdp_auth.py
              readOnly: true
            - name: litellm-config
              mountPath: /app/pdp_guardrail.py
              subPath: pdp_guardrail.py
              readOnly: true
            - name: litellm-config
              mountPath: /app/pdp_mcp.py
              subPath: pdp_mcp.py
              readOnly: true
            - name: litellm-config
              mountPath: /app/audit_fields.py
              subPath: audit_fields.py
              readOnly: true
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-gateway
spec:
  selector:
    app: litellm-gateway
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-gateway
